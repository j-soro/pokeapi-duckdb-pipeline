[project]
name = "pokeapi-pipeline"
version = "0.1.0"
description = "Extract & Load pipeline: PokeAPI → DuckDB (medallion: raw → staging)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "hishel>=0.1",
    "msgspec>=0.19",
    "duckdb>=1.5",
]

[project.scripts]
pipeline = "pokeapi_pipeline.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pokeapi_pipeline"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
